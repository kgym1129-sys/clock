<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Clock | デジタル＆アナログ時計</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111827;color:#f7f7f7;padding:clamp(10px,2.5vw,24px);display:flex;justify-content:center;align-items:center}
.app{width:min(100%,900px);display:grid;gap:14px}
.display{background:#202938;border-radius:22px;padding:clamp(16px,3vw,28px);text-align:center;min-width:0}
.date{font-size:clamp(13px,2vw,17px);opacity:.85}
.digital{font-size:clamp(42px,9vw,76px);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1.2;margin:8px 0}
.period{font-size:13px;opacity:.8}
.analog{border-top:1px solid #ffffff35;margin-top:18px;padding-top:16px}
.caption{font-size:11px;letter-spacing:.17em;opacity:.75;margin-bottom:12px}
.face{width:min(57vw,260px);aspect-ratio:1;border:4px solid currentColor;border-radius:50%;margin:auto;position:relative}
.num{position:absolute;inset:0;display:grid;place-items:start center;padding-top:7px;font-size:clamp(14px,3vw,19px);font-weight:650}
.num span{display:block}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:8px}
.hour{height:25%;width:6px;background:currentColor}
.minute{height:35%;width:4px;background:currentColor}
.second{height:40%;width:2px;background:#ef6262}
.pin{position:absolute;width:11px;height:11px;border-radius:50%;background:#ef6262;left:50%;top:50%;transform:translate(-50%,-50%)}
.settings{background:#1f2937;border:1px solid #ffffff1c;border-radius:18px;padding:clamp(14px,2.5vw,20px);display:grid;gap:14px;min-width:0}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:14px;font-weight:650}.hint{font-size:12px;color:#cbd5e1;margin-top:3px}
button{border:1px solid #ffffff40;border-radius:10px;padding:9px 12px;background:#374151;color:white;font:inherit;font-size:13px;cursor:pointer;touch-action:manipulation}
button.active{background:#2563eb;border-color:#2563eb}
button:focus-visible,input:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
.buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
input[type=color]{width:42px;height:36px;border:1px solid #ffffff40;border-radius:8px;background:transparent;padding:2px}
.presets{justify-content:center}
.reset{width:100%}
.footer{text-align:center;color:#aab3c2;font-size:11px}
[hidden]{display:none!important}
@media (orientation:landscape) and (min-width:600px){
 body{align-items:center}
 .app{grid-template-columns:minmax(0,1.12fr) minmax(270px,.88fr);align-items:center;max-width:1100px}
 .display{grid-row:1 / span 2}
 .digital{font-size:clamp(44px,7vw,72px)}
 .face{width:min(38vh, min(30vw,270px))}
 .analog{margin-top:12px;padding-top:12px}
 .settings{align-self:center}
 .footer{grid-column:2}
 .presets{justify-content:flex-start}
}
@media (orientation:landscape) and (max-width:599px){
 body{padding:8px}
 .app{grid-template-columns:1fr 1fr;gap:8px;align-items:center}
 .display{padding:10px}
 .digital{font-size:clamp(32px,7vw,48px);margin:5px 0}
 .face{width:min(34vh,35vw)}
 .analog{margin-top:8px;padding-top:8px}
 .caption{margin-bottom:6px}
 .settings{padding:10px;gap:8px}
 .setting{gap:5px}
 .label{font-size:12px}
 .hint{font-size:10px}
 button{padding:7px 8px;font-size:11px}
 .presets{gap:4px}
 .footer{grid-column:1/-1}
}
</style>
</head>
<body>
<main class="app">
<section class="display" id="display">
 <div class="date" id="date">読み込み中…</div>
 <div class="digital" id="digital">--:--:--</div>
 <div class="period" id="period">24時間表記</div>
 <div class="analog" id="analog">
  <div class="caption">ANALOG CLOCK</div>
  <div class="face" id="face">
   <div class="num"><span>12</span></div>
   <div class="num" style="transform:rotate(30deg)"><span style="transform:rotate(-30deg)">1</span></div>
   <div class="num" style="transform:rotate(60deg)"><span style="transform:rotate(-60deg)">2</span></div>
   <div class="num" style="transform:rotate(90deg)"><span style="transform:rotate(-90deg)">3</span></div>
   <div class="num" style="transform:rotate(120deg)"><span style="transform:rotate(-120deg)">4</span></div>
   <div class="num" style="transform:rotate(150deg)"><span style="transform:rotate(-150deg)">5</span></div>
   <div class="num" style="transform:rotate(180deg)"><span style="transform:rotate(-180deg)">6</span></div>
   <div class="num" style="transform:rotate(210deg)"><span style="transform:rotate(-210deg)">7</span></div>
   <div class="num" style="transform:rotate(240deg)"><span style="transform:rotate(-240deg)">8</span></div>
   <div class="num" style="transform:rotate(270deg)"><span style="transform:rotate(-270deg)">9</span></div>
   <div class="num" style="transform:rotate(300deg)"><span style="transform:rotate(-300deg)">10</span></div>
   <div class="num" style="transform:rotate(330deg)"><span style="transform:rotate(-330deg)">11</span></div>
   <div class="hand hour" id="hour"></div><div class="hand minute" id="minute"></div>
   <div class="hand second" id="second"></div><div class="pin"></div>
  </div>
 </div>
</section>
<section class="settings">
 <div class="setting"><div><div class="label">時刻の表示形式</div><div class="hint">12時間・24時間</div></div><div class="buttons"><button class="active" data-format="24">24時間</button><button data-format="12">12時間</button></div></div>
 <div class="setting"><div><div class="label">背景色</div><div class="hint">時計の背景色</div></div><div class="buttons"><input type="color" id="picker" value="#202938"><span class="hint" id="hex">#202938</span></div></div>
 <div class="buttons presets">
  <button data-color="#202938" style="background:#202938">ネイビー</button><button data-color="#243b35" style="background:#243b35">グリーン</button>
  <button data-color="#493448" style="background:#493448">パープル</button><button data-color="#3e4148" style="background:#3e4148">グレー</button>
  <button data-color="#f1eee6" style="background:#f1eee6;color:#333">アイボリー</button><button data-color="#e4edf5" style="background:#e4edf5;color:#333">ライトブルー</button>
 </div>
 <div class="setting"><div class="label">アナログ時計</div><button id="analogToggle" class="active">表示中</button></div>
 <div class="setting"><div class="label">秒の表示</div><button id="secondsToggle" class="active">表示中</button></div>
 <button class="reset" id="reset">設定を初期状態に戻す ↺</button>
</section>
<div class="footer">端末の現在時刻に自動で同期します</div>
</main>
<script>
(function(){
 'use strict';
 let format='24',showAnalog=true,showSeconds=true;
 const $=id=>document.getElementById(id);
 function tick(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),ms=d.getMilliseconds();
  const days=['日','月','火','水','木','金','土'];
  $('date').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+days[d.getDay()]+'）';
  const hh=format==='24'?h:(h%12||12);
  $('digital').textContent=String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0')+(showSeconds?':'+String(s).padStart(2,'0'):'');
  $('period').textContent=format==='24'?'24時間表記':'12時間表記 ・ '+(h<12?'AM':'PM');
  $('hour').style.transform='translateX(-50%) rotate('+((h%12)*30+m*.5)+'deg)';
  $('minute').style.transform='translateX(-50%) rotate('+(m*6+s*.1)+'deg)';
  $('second').style.transform='translateX(-50%) rotate('+(s*6+ms*.006)+'deg)';
 }
 function color(c){
  $('display').style.background=c;$('picker').value=c;$('hex').textContent=c.toUpperCase();
  const n=parseInt(c.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const fg=(r*299+g*587+b*114)/1000>145?'#20242b':'#f7f7f7';
  $('display').style.color=fg;$('face').style.color=fg;$('face').style.borderColor=fg;
 }
 document.querySelectorAll('[data-format]').forEach(b=>b.addEventListener('click',()=>{
  format=b.dataset.format;document.querySelectorAll('[data-format]').forEach(x=>x.classList.toggle('active',x===b));tick();
 }));
 $('picker').addEventListener('input',e=>color(e.target.value));
 document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>color(b.dataset.color)));
 $('analogToggle').addEventListener('click',()=>{
  showAnalog=!showAnalog;$('analog').hidden=!showAnalog;$('analogToggle').textContent=showAnalog?'表示中':'非表示';$('analogToggle').classList.toggle('active',showAnalog);
 });
 $('secondsToggle').addEventListener('click',()=>{
  showSeconds=!showSeconds;$('secondsToggle').textContent=showSeconds?'表示中':'非表示';$('secondsToggle').classList.toggle('active',showSeconds);tick();
 });
 $('reset').addEventListener('click',()=>{
  format='24';showAnalog=true;showSeconds=true;color('#202938');
  document.querySelectorAll('[data-format]').forEach(x=>x.classList.toggle('active',x.dataset.format==='24'));
  $('analog').hidden=false;$('analogToggle').textContent='表示中';$('analogToggle').classList.add('active');
  $('secondsToggle').textContent='表示中';$('secondsToggle').classList.add('active');tick();
 });
 color('#202938');tick();window.setInterval(tick,100);
})();
</script>
</body>
</html>
